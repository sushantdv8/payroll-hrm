# /etc/nginx/snippets/payroll-proxy.conf - what nginx tells the sign-in layer about the visitor (included by payroll-site.conf)
# The layer trusts X-Real-IP only from nginx on the same server, and ignores the X-Forwarded-* headers; nothing a browser sends is passed on as such.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 300s;                      # big reports and imports can take a minute or two
proxy_send_timeout 300s;
proxy_request_buffering off;                  # uploads stream to the layer instead of being stored first
