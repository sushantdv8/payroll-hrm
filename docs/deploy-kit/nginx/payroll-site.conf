# /etc/nginx/sites-available/payroll   (install-ubuntu.sh puts it there, replaces __DOMAIN__ and enables it)
# HTTPS is added by certbot:   certbot --nginx -d __DOMAIN__ -m <e-mail> --agree-tos --no-eff-email --redirect
# Every request goes to the sign-in layer (127.0.0.1:8080); the application itself is never reachable from outside.
# Needs /etc/nginx/conf.d/payroll-ratelimit.conf (the limit_req_zone) and /etc/nginx/snippets/payroll-proxy.conf (both in this folder).

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    server_tokens off;
    client_max_body_size 25m;                 # largest upload: 11 MB documents; imports send up to 8.5 MB per request

    # sign-in attempts are limited here as well (the layer has its own limits)
    location = /__login {
        limit_req zone=payroll_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/payroll-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/payroll-proxy.conf;
    }
}
