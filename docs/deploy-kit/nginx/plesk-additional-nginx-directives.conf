# Plesk > Websites & Domains > hrm.erpkishorexports.com > Apache & nginx Settings > "Additional nginx directives"
# (menus differ slightly between Plesk versions). Paste the block below; Plesk adds it to the HTTPS server of this subdomain.
# Prerequisites: DNS A record to this server, Let's Encrypt certificate installed, "301 redirect from HTTP to HTTPS" ticked.
# Port 3000 = the sign-in layer once it exists; the application itself while you only test on the server.
#
# "^~ /" (instead of a plain "/") avoids the error "duplicate location /" when Plesk already has its own location /,
# and makes nginx hand every request to the application before it tries Plesk's file-type rules.
# If your Plesk still keeps serving some files itself, switch off "Proxy mode" and "Smart static files processing" for this subdomain.

location ^~ / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 25m;      # largest upload: 11 MB documents; imports send up to 8.5 MB per request
    proxy_read_timeout 300s;       # big reports and imports can take a minute or two
    proxy_send_timeout 300s;
}
